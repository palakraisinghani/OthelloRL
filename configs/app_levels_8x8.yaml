# Othello-Player difficulty ladder (8x8): ONE AlphaZero model (the strongest), weakened
# per level by the move temperature only (decided 2026-10-12).
# All levels share the same search budget `sims`; the move is sampled with probability
# proportional to N^(1/T) over the root visit counts N (T = 0: most-visited move). No root noise.
# PLAN Step 5.7 calibrates `sims` (largest budget within 2 s per move) and the four
# temperatures (each level beats the one below >= 70%), starting from these candidates.
sims: 200
candidate_temperatures: [0.0, 0.25, 0.5, 1.0, 2.0, 4.0]
levels:                       # verified 2026-10-13 (`eval_8x8.py verify`): adjacent levels 76%, 86%, 86%
  - {level: 1, name: Easy,    temperature: 8.0}
  - {level: 2, name: Medium,  temperature: 2.0}
  - {level: 3, name: Hard,    temperature: 1.0}
  - {level: 4, name: Master,  temperature: 0.0}
calibrated: true
