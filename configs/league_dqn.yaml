# Phase 3: does opponent variety help DQN? (6x6)
# Learner = Phase 2 DQN+ (Double DQN). Each training game is against a league
# member with probability p (two-level: fixed agents vs own snapshots, 50/50),
# otherwise against the live learner (pure self-play).
out: results/league/dqn
board_size: 6
train_games: 200000
eval_every: 5000
eval_openings: 100
final_eval_openings: 500
opening_plies: 6
eval_seed: 4242
seeds: [0, 1, 2]
eps_start: 0.3
eps_end: 0.05
eps_decay_frac: 0.5

# learning-curve opponent: held-out (heuristic and minimax-d4 are in the league)
opponent: {type: minimax, kwargs: {depth: 3, weights: TUNED}}
final_opponents:
  # held-out
  minimax-d2: {type: minimax, kwargs: {depth: 2, weights: TUNED}}
  minimax-d3: {type: minimax, kwargs: {depth: 3, weights: TUNED}}
  # in-league (reported, flagged)
  random: {type: random}
  heuristic: {type: heuristic, kwargs: {epsilon: 0.05, weights: TUNED}}
  minimax-d4: {type: minimax, kwargs: {depth: 4, weights: TUNED}}

league_members:
  - {name: random, type: random}
  - {name: heuristic, type: heuristic, kwargs: {epsilon: 0.05, weights: TUNED}}
  - {name: minimax-d4, type: minimax, kwargs: {depth: 4, weights: TUNED}}
  - {name: q-learning, path: results/classical/q-learning/seed0}
  - {name: sarsa, path: results/classical/sarsa/seed0}
  - {name: mc-control, path: results/classical/mc-control/seed0}
  - {name: linear, path: results/classical/linear/seed0}
  - {name: dqn-classical, path: results/classical/dqn/seed0}

runs:
  p0:   {learner: dqn, kwargs: {double: true}, league: {p_league: 0.0,  snapshot_every: 5000, max_snapshots: 20, fixed_frac: 0.5}}
  p25:  {learner: dqn, kwargs: {double: true}, league: {p_league: 0.25, snapshot_every: 5000, max_snapshots: 20, fixed_frac: 0.5}}
  p50:  {learner: dqn, kwargs: {double: true}, league: {p_league: 0.5,  snapshot_every: 5000, max_snapshots: 20, fixed_frac: 0.5}}
  p75:  {learner: dqn, kwargs: {double: true}, league: {p_league: 0.75, snapshot_every: 5000, max_snapshots: 20, fixed_frac: 0.5}}
  p100: {learner: dqn, kwargs: {double: true}, league: {p_league: 1.0,  snapshot_every: 5000, max_snapshots: 20, fixed_frac: 0.5}}
checkpoint_every: 25000
