# Phase 4 — multi-agent co-evolution vs self-play (DQN, 6x6).
# N independent Double DQNs (identical to the Phase 3 / Step 2.9 self-play DQN)
# train only by playing each other; uniform pairing; both members of a game learn.
out: results/coevo
board_size: 6
eval_every: 5000            # per member, in that member's own games
checkpoint_every: 25000     # per member
eval_openings: 100
final_eval_openings: 500
opening_plies: 6
eval_seed: 4242
seeds: [0, 1, 2]
eps_start: 0.3
eps_end: 0.05
eps_decay_frac: 0.5         # of each member's own game budget
learner: {type: dqn, kwargs: {double: true}}

# learning-curve opponent (held out)
opponent: {type: minimax, kwargs: {depth: 3, weights: TUNED}}
final_opponents:
  minimax-d2: {type: minimax, kwargs: {depth: 2, weights: TUNED}}
  minimax-d3: {type: minimax, kwargs: {depth: 3, weights: TUNED}}
  random: {type: random}
  heuristic: {type: heuristic, kwargs: {epsilon: 0.05, weights: TUNED}}
  minimax-d4: {type: minimax, kwargs: {depth: 4, weights: TUNED}}

runs:
  # F1: equal games per agent (each member plays as many games as one self-play DQN)
  F1-N2: {population: 2, games_per_member: 200000}
  F1-N4: {population: 4, games_per_member: 200000}
  F1-N8: {population: 8, games_per_member: 200000}
  # F2: equal total games (the population shares one self-play run's 200k games)
  F2-N4: {population: 4, games_per_member: 100000}
  F2-N8: {population: 8, games_per_member: 50000}
