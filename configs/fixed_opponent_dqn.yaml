# Step 2.9 — motivation for self-play: the ceiling of a fixed training opponent.
# Three Double DQNs, identical to the Phase 3 self-play DQN, each trained only
# against one fixed opponent of increasing strength.
out: results/fixed_opponent
board_size: 6
train_games: 200000
eval_every: 5000
eval_openings: 100
final_eval_openings: 500
opening_plies: 6
eval_seed: 4242
seeds: [0, 1, 2]
eps_start: 0.3
eps_end: 0.05
eps_decay_frac: 0.5
checkpoint_every: 50000

# learning-curve opponent: none of the three trains against it
opponent: {type: minimax, kwargs: {depth: 2, weights: TUNED}}
final_opponents:
  random: {type: random}
  heuristic: {type: heuristic, kwargs: {epsilon: 0.05, weights: TUNED}}
  minimax-d2: {type: minimax, kwargs: {depth: 2, weights: TUNED}}
  minimax-d3: {type: minimax, kwargs: {depth: 3, weights: TUNED}}
  minimax-d4: {type: minimax, kwargs: {depth: 4, weights: TUNED}}

runs:
  vs-random:     {learner: dqn, kwargs: {double: true}, train_opponent: {type: random}}
  vs-heuristic:  {learner: dqn, kwargs: {double: true}, train_opponent: {type: heuristic, kwargs: {epsilon: 0.05, weights: TUNED}}}
  vs-minimax-d3: {learner: dqn, kwargs: {double: true}, train_opponent: {type: minimax, kwargs: {depth: 3, weights: TUNED}}}
