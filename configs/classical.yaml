# Why classical RL plateaus: every learner vs the same fixed heuristic bot on 6x6.
board_size: 6
train_games: 200000
eval_every: 5000
eval_openings: 100          # 200 greedy eval games per curve point
final_eval_openings: 500    # 1000 games vs heuristic/random, 500 vs minimax
opening_plies: 6
eval_seed: 4242
seeds: [0, 1, 2]
eps_start: 0.3
eps_end: 0.05
eps_decay_frac: 0.5

opponent: {type: heuristic, kwargs: {epsilon: 0.05, weights: TUNED}}
final_opponents:
  heuristic: {type: heuristic, kwargs: {epsilon: 0.05, weights: TUNED}}
  random: {type: random}
  minimax-d4: {type: minimax, kwargs: {depth: 4, weights: TUNED}}

runs:
  q-learning:  {learner: tabular, kwargs: {method: q, alpha: 0.1}}
  sarsa:       {learner: tabular, kwargs: {method: sarsa, alpha: 0.1}}
  mc-control:  {learner: tabular, kwargs: {method: mc}}
  linear:      {learner: linear, kwargs: {alpha: 0.01}}
  dqn:         {learner: dqn, kwargs: {}}
  # disc-count ablation (linear FA)
  linear-nodisc:     {learner: linear, kwargs: {alpha: 0.01, features: [bias, mobility, corner, xsquare, edge_stable]}}
  linear-disconly:   {learner: linear, kwargs: {alpha: 0.01, features: [bias, disc]}}
  linear-discreward: {learner: linear, kwargs: {alpha: 0.01}, reward: disc_margin}
